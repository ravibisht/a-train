<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5fd8"/>
      <stop offset="0.55" stop-color="#0b2f8a"/>
      <stop offset="1" stop-color="#061a4f"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e6ecf7"/>
      <stop offset="0.52" stop-color="#b9c6de"/>
      <stop offset="1" stop-color="#f4f7fc"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5122b" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#e5122b"/>
      <stop offset="1" stop-color="#ff5b6b"/>
    </linearGradient>
    <linearGradient id="lines" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <polygon points="100,100 620,100 100,620" fill="#ffffff" opacity="0.07"/>
    <polygon points="60,580 900,540 900,600 60,640" fill="url(#streak)" opacity="0.95"/>
    <rect x="120" y="380" width="360" height="26" rx="13" fill="url(#lines)"/>
    <rect x="180" y="450" width="300" height="26" rx="13" fill="url(#lines)" opacity="0.7"/>
    <rect x="240" y="740" width="380" height="26" rx="13" fill="url(#lines)" opacity="0.6"/>
  </g>
  <g filter="url(#shadow)" transform="skewX(-12) translate(140 0)">
    <text x="512" y="790" text-anchor="middle" font-family="Impact, 'Arial Black', Futura, sans-serif"
          font-weight="900" font-size="640" fill="url(#chrome)" stroke="#061a4f" stroke-width="14">A</text>
  </g>
</svg>
